# docker-compose.lab.yml: the ONE recipe every install variant of the n8n install test run uses.
# Disposable test repo (lovebuilt/n8n-autoscaling-labtest), NOT the fork. See labtest/README.md.
#
# Rules this file keeps (TEST-PLAN.md "The one recipe"):
#   - top-level name from COMPOSE_PROJECT_NAME (required), and the autoscaler gets the same value
#   - stock n8n images at ${N8N_VERSION:-2.39.8}; redis and postgres as in the fork
#   - no ./ mounts, no ${} in a volume target, no external networks
#   - ${VAR:?} guards on every secret
#   - only n8n main is published, on 127.0.0.1:${LABTEST_N8N_PORT}
# Dropped from the fork's set: n8n-backup (profile), redis-monitor.
#
# The autoscaler runs `docker compose up --scale` from INSIDE its own container. For that to reuse the
# running workers instead of recreating them, compose inside must render the SAME config, so:
#   - this file is baked into the autoscaler image (labtest/autoscaler.Dockerfile) at /app
#   - every variable this file reads is handed to the autoscaler (x-all-vars below)
# Every ${VAR} in this file must appear in x-all-vars; labtest/vars-inventory.txt lists them.

name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

x-all-vars: &all-vars
  COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}
  LABTEST_N8N_PORT: ${LABTEST_N8N_PORT:?LABTEST_N8N_PORT is required}
  N8N_VERSION: ${N8N_VERSION:-2.39.8}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Chicago}
  WEBHOOK_URL: ${WEBHOOK_URL:-}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN is required}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-n8n-env: &n8n-env
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Chicago}
  TZ: ${GENERIC_TIMEZONE:-America/Chicago}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_SECURE_COOKIE: "false"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  WEBHOOK_URL: ${WEBHOOK_URL:-}
  # queue mode, as in the fork
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  # database
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  # task runners, external mode (n8n 2.x), as in the fork
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN is required}

x-n8n: &service-n8n
  image: n8nio/n8n:${N8N_VERSION:-2.39.8}
  restart: unless-stopped
  logging: *default-logging
  environment: *n8n-env
  networks: [n8n-network]

volumes:
  postgres_data:
  redis_data:
  n8n_main:
  n8n_webhook:

networks:
  n8n-network:
    driver: bridge

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # password read from the environment, so it never sits on the process command line
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - redis_data:/data
    networks: [n8n-network]

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [n8n-network]

  n8n:
    <<: *service-n8n
    ports:
      - "127.0.0.1:${LABTEST_N8N_PORT:?LABTEST_N8N_PORT is required}:5678"
    volumes:
      - n8n_main:/home/node/.n8n
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  n8n-webhook:
    <<: *service-n8n
    command: webhook
    volumes:
      - n8n_webhook:/home/node/.n8n
    depends_on:
      n8n: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  n8n-worker:
    <<: *service-n8n
    command: worker
    stop_grace_period: 1m
    volumes:
      - n8n_main:/home/node/.n8n
    depends_on:
      n8n: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # task runner sidecar; scaled one to one with n8n-worker (as in the fork)
  n8n-worker-runner:
    image: n8nio/runners:${N8N_VERSION:-2.39.8}
    restart: unless-stopped
    logging: *default-logging
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN is required}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Chicago}
    depends_on:
      n8n-worker: {condition: service_started}
    networks: [n8n-network]

  n8n-autoscaler:
    build:
      context: .
      dockerfile: labtest/autoscaler.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *all-vars
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_NAME_PREFIX: bull
      QUEUE_NAME: jobs
      N8N_WORKER_SERVICE_NAME: n8n-worker
      N8N_WORKER_RUNNER_SERVICE_NAME: n8n-worker-runner
      COMPOSE_FILE_PATHS: /app/docker-compose.lab.yml
      COMPOSE_PROJECT_DIRECTORY: /app
      MIN_REPLICAS: "1"
      MAX_REPLICAS: "3"
      SCALE_UP_QUEUE_THRESHOLD: "5"
      SCALE_DOWN_QUEUE_THRESHOLD: "2"
      POLLING_INTERVAL_SECONDS: "10"
      COOLDOWN_PERIOD_SECONDS: "10"
      LOG_LEVEL: INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis: {condition: service_healthy}
      n8n-worker: {condition: service_started}
    networks: [n8n-network]

  # shows which commit's files were built: prints labtest/MARKER, then idles
  marker:
    build:
      context: .
      dockerfile: labtest/marker.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    networks: [n8n-network]
